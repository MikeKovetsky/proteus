name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Test the layout flow's scripts
        run: python3 -m unittest discover -s test/flow -v

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the tests fail, so check results.xml for failed tests
          python -m cocotb_tools.check_results results.xml

      - name: Run independent third-party protocol oracle tests (cocotbext)
        run: |
          pip install --no-deps cocotbext-uart==0.1.4 cocotbext-i2c==0.1.2 cocotbext-spi==0.6.2
          cd test/oracle
          make clean
          make
          python -m cocotb_tools.check_results results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*

  # protoemu: the golden model, its compiler and the RTL against the model. A job of its own, so that a failure
  # here and one in the pin tests each show. Inside it, every suite runs, also after one has failed.
  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # For `make -C test mutants`: test/Makefile includes cocotb's makefiles, whatever the target.
      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: Compiler tests
        if: ${{ !cancelled() }}
        run: python3 -m bakeoff.cand_table.test_compiler

      - name: Benches' self-test
        if: ${{ !cancelled() }}
        run: python3 -m bakeoff.harness.selftest

      - name: Golden model's self-check
        if: ${{ !cancelled() }}
        run: python3 -m bakeoff.cand_table.selfcheck

      - name: All benches on the golden model
        if: ${{ !cancelled() }}
        run: python3 -m bakeoff.run --candidate cand_table --strict

      - name: The programming guide's example
        if: ${{ !cancelled() }}
        run: python3 docs/examples/run_uart_8e1.py

      - name: Lockstep and its planted bugs
        if: ${{ !cancelled() }}
        run: make -C test mutants
