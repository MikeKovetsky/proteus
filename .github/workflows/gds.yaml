name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l # or ihp-sg13g2

      # protoemu: LibreLane's own table is cut short in the log and the violating pins are only in an artifact.
      # This prints both, also after a failed layout, and fails on a violation or a missing figure.
      - name: Layout report
        if: always()
        run: python3 .github/scripts/layout_report.py runs/wokwi

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  viewer:
    needs: gds
    # protoemu: the public Pages viewer shows main's layout only, never an unmerged branch's. Two locks: the
    # condition, and the github-pages environment's main-only rule, which binds only a job that names it (the
    # electrical-fix branch deployed past it in run 44111759734).
    if: github.ref == 'refs/heads/main'
    environment: github-pages
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a
