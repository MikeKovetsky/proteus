# Tiny Tapeout project information
project:
  title:        "protoemu: a programmable protocol emulator"      # Project title
  author:       "Mike Kovetsky"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A small programmable chip that speaks UART, SPI, I2C and other protocols from loaded programs"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     60000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_mikekovetsky_protoemu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "protoemu_core.v"
    - "protoemu_fifo.v"
    - "protoemu_table.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
# protoemu: the host (the demo board's RP2350) talks on ui and uo; the protocols run on uio. docs/info.md
# describes the host link.
pinout:
  # Inputs: the host link
  ui[0]: "HOST_D0"
  ui[1]: "HOST_D1"
  ui[2]: "HOST_D2"
  ui[3]: "HOST_D3"
  ui[4]: "PORT0"
  ui[5]: "PORT1"
  ui[6]: "WR_STROBE"
  ui[7]: "RD_STROBE"

  # Outputs: the host link
  uo[0]: "HOST_Q0"
  uo[1]: "HOST_Q1"
  uo[2]: "HOST_Q2"
  uo[3]: "HOST_Q3"
  uo[4]: "ROOM"
  uo[5]: "HAS_BYTE"
  uo[6]: "RUNNING"
  uo[7]: "OVERFLOW"

  # Bidirectional pins: the protocol pins, set per program
  uio[0]: "P0"
  uio[1]: "P1"
  uio[2]: "P2"
  uio[3]: "P3"
  uio[4]: "P4"
  uio[5]: "P5"
  uio[6]: "P6"
  uio[7]: "P7"

# Do not change!
yaml_version: 6
